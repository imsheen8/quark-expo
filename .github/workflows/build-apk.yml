name: Build Android APK

# التشغيل: من تبويب Actions ← Build Android APK ← Run workflow، أو تلقائيًا عند دفع وسم يبدأ بـ v (مثل v1.0.0)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # لرفع الـ APK إلى Releases عند الوسوم

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align Expo packages to the SDK
        run: npx expo install --fix || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (arm64)
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/QUARK-AI.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: QUARK-AI-apk
          path: out/QUARK-AI.apk
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/QUARK-AI.apk
