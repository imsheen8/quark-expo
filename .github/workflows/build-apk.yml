name: Build Android APK

# التشغيل: من تبويب Actions ← Build Android APK ← Run workflow، أو تلقائيًا عند دفع وسم يبدأ بـ v (مثل v1.0.0)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # لرفع الـ APK إلى Releases عند الوسوم

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # توقيع ثابت: أضف الأسرار الأربعة (انظر README). بدونها يُوقَّع بمفتاح debug فلا يُحدَّث التطبيق فوق نسخة موقّعة بمفتاح آخر.
      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          n=0
          for v in "$KS_B64" "$KS_PASS" "$KS_ALIAS" "$KEY_PASS"; do [ -n "$v" ] && n=$((n+1)); done
          if [ "$n" = 0 ]; then
            echo "::warning::لا أسرار توقيع — سيُوقَّع الـ APK بمفتاح debug المؤقت."
          elif [ "$n" != 4 ]; then
            echo "::error::أسرار التوقيع ناقصة ($n من 4). المطلوب: ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD"
            exit 1
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/quark-release.jks"
            echo "::add-mask::$KS_PASS"
            {
              echo "QUARK_KEYSTORE_FILE=$RUNNER_TEMP/quark-release.jks"
              echo "QUARK_KEYSTORE_PASSWORD=$KS_PASS"
              echo "QUARK_KEY_ALIAS=$KS_ALIAS"
              echo "QUARK_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "تم تجهيز مفتاح التوقيع الثابت."
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align Expo packages to the SDK
        run: npx expo install --fix || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (arm64)
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/QUARK-AI.apk
          ls -la out

      - name: Show signing certificate
        run: |
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs out/QUARK-AI.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          if [ -n "$QUARK_KEYSTORE_FILE" ]; then echo "موقّع بالمفتاح الثابت"; else echo "موقّع بمفتاح debug المؤقت"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: QUARK-AI-apk
          path: out/QUARK-AI.apk
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/QUARK-AI.apk
